<section class="step">
  <h3 class="step__title">Cor do hardware</h3>
  <div class="swatch-grid">
    @for (c of cores; track c.id) {
      <button class="swatch swatch--color"
              [style.--swatch-color]="c.hex"
              [class.swatch--selected]="montar().hardware.color === c.hex"
              (click)="setCor(c.hex)">
        <span class="swatch__label">{{ c.nome }}</span>
      </button>
    }
  </div>

  <h3 class="step__title">Tipo de ponte</h3>
  <div class="chip-row">
    <button class="chip" [class.chip--selected]="montar().ponte.tipo === 'tremolo-2pt'" (click)="setPonte('tremolo-2pt')">Tremolo 2pt</button>
    <button class="chip" [class.chip--selected]="montar().ponte.tipo === 'tune-o-matic'" (click)="setPonte('tune-o-matic')">Tune-o-Matic</button>
    <button class="chip" [class.chip--selected]="montar().ponte.tipo === 'hardtail'" (click)="setPonte('hardtail')">Hardtail</button>
    <button class="chip" [class.chip--selected]="montar().ponte.tipo === 'floyd-rose'" (click)="setPonte('floyd-rose')">Floyd Rose</button>
  </div>
</section>
