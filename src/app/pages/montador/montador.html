    <div class="modelo">

        <div class="corpos">

                <defs>
                    <pattern id="tex-body" patternUnits="objectBoundingBox" width="1" height="1">

                    </pattern>
                </defs>

        <div class="hardware_modelo">

            <svg width="50" height="50" viewBox="0 0 84 79" fill="none" xmlns="http://www.w3.org/2000/svg"
                class="ponte_fixa">
                <g id="bridge-fixed-strat">
                    <rect id="hardware-fill" y="11" width="84" height="55" rx="5" fill="#AAB3B6" />
                    <rect id="hardware-accent-fill" x="11" y="14" width="9" height="40" rx="2" fill="#E9E3D3" />
                    <rect id="hardware-accent-fill_2" x="21.5" y="16" width="9" height="40" rx="2" fill="#E9E3D3" />
                    <rect id="hardware-accent-fill_3" x="32" y="18" width="9" height="40" rx="2" fill="#E9E3D3" />
                    <rect id="hardware-accent-fill_4" x="42.5" y="14" width="9" height="40" rx="2" fill="#E9E3D3" />
                    <rect id="hardware-accent-fill_5" x="53" y="16" width="9" height="40" rx="2" fill="#E9E3D3" />
                    <rect id="hardware-accent-fill_6" x="63.5" y="18" width="9" height="40" rx="2" fill="#E9E3D3" />
                </g>
            </svg>

            <svg width="15" height="15" viewBox="0 0 37 37" fill="none" xmlns="http://www.w3.org/2000/svg"
                class="knob1">
                <g id="control-knob">
                    <circle id="detail-fill" cx="18.5" cy="18.5" r="18.5" fill="#30383B" />
                    <circle id="hardware-accent-fill" cx="18.5" cy="18.5" r="14.5" fill="#E9E3D3" />
                </g>
            </svg>

            <svg width="15" height="15" viewBox="0 0 37 37" fill="none" xmlns="http://www.w3.org/2000/svg"
                class="knob2">
                <g id="control-knob">
                    <circle id="detail-fill" cx="18.5" cy="18.5" r="18.5" fill="#30383B" />
                    <circle id="hardware-accent-fill" cx="18.5" cy="18.5" r="14.5" fill="#E9E3D3" />
                </g>
            </svg>

            <svg width="25" height="25" viewBox="0 0 48 84" fill="none" xmlns="http://www.w3.org/2000/svg" class="jack">
                <g id="output-jack">
                    <ellipse id="hardware-accent-fill" cx="24" cy="41.5" rx="14" ry="15.5" fill="#E9E3D3" />
                    <ellipse id="detail-fill" cx="24" cy="41.5" rx="8" ry="9.5" fill="#30383B" />
                </g>
            </svg>

        </div>

        <div class="captadores_modelo">
            <svg width="60" height="35" viewBox="0 0 78 35" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="pickup-p90">
                    <rect id="pickup-cover-fill" width="78" height="35" rx="6" fill="#E9E3D3" />
                    <circle id="pole-fill" cx="14" cy="17.5" r="2.5" fill="#AAB3B6" />
                    <circle id="pole-fill_2" cx="24" cy="17.5" r="2.5" fill="#AAB3B6" />
                    <circle id="pole-fill_3" cx="34" cy="17.5" r="2.5" fill="#AAB3B6" />
                    <circle id="pole-fill_4" cx="44" cy="17.5" r="2.5" fill="#AAB3B6" />
                    <circle id="pole-fill_5" cx="54" cy="17.5" r="2.5" fill="#AAB3B6" />
                    <circle id="pole-fill_6" cx="64" cy="17.5" r="2.5" fill="#AAB3B6" />
                </g>
            </svg>
        </div>
    </div>
    <div class="opcoes">
        <div class="sub_menu">
            <button [class.active]="section() === 'corpo'" (click)="setSection('corpo')"> Corpo </button>

            <button [class.active]="section() === 'braco'" (click)="setSection('braco')"> Braço </button>

            <button [class.active]="section() === 'hardware'" (click)="setSection('hardware')"> Hardware </button>

        </div>
        <div class="corpo_content" [class.active]="section() == 'corpo'">

            <div class="madeira_corpo">

                <p> -- Madeira corpo -- </p>

                <div class="input_radio">
                    <label for="m_corpo_alder" class="inputs">
                        <input type="radio" name="m_corpo" value="Alder" id="m_corpo_alder">
                        <img src="alder.jpg" alt="Alder" width="50px" height="50px">
                    </label>
                    Alder
                </div>

                <div class="input_radio">
                    <label for="m_corpo_basswood" class="inputs">
                        <input type="radio" name="m_corpo" value="Basswood" id="m_corpo_basswood" checked>
                        <img src="basswood.jpg" alt="Basswood" width="50px" height="50px">
                    </label>
                    Basswood
                </div>

                <div class="input_radio">
                    <label for="m_corpo_maple" class="inputs">
                        <input type="radio" name="m_corpo" value="Maple" id="m_corpo_maple">
                        <img src="maple.jpg" alt="Maple" width="50px" height="50px">
                    </label>
                    Maple
                </div>

            </div>

            <div class="tipo_corpo">
                <p> -- Tipo de Corpo -- </p>

                <div class="inputs">

                    <div class="sub_inputs">
                        <input type="radio" name="corpo" value="Strato" id="t_corpo_strato">
                        <label for="t_corpo_strato" class="inputs">Strato</label>
                    </div>

                    <input type="radio" name="corpo" value="Les Paul" id="t_corpo_les">
                    <label for="t_corpo_les" class="inputs">Les Paul</label>
                    <div class="sub_inputs">
                        <input type="radio" name="corpo" value="Tele" id="t_corpo_tele">
                        <label for="t_corpo_tele" class="inputs">Tele</label>
                    </div>

                    <div class="sub_inputs">
                        <input type="radio" name="corpo" value="SG" id="t_corpo_sg" checked>
                        <label for="t_corpo_sg" class="inputs">SG</label>
                    </div>

                    <div class="sub_inputs">
                        <input type="radio" name="corpo" value="Offset" id="t_corpo_offset">
                        <label for="t_corpo_offset" class="inputs">Offset</label>
                    </div>

                </div>

            </div>

            <p> -- Cor Corpo -- </p>

            <select name="cor_corpo" id="">
                <option id="opt_red" value="Vermelho">Vermelho</option>
                <option id="opt_blu" value="Azul">Azul</option>
                <option id="opt_blk" value="Preto">Preto</option>
                <option id="opt_yll" value="Amarelo">Amarelo</option>
                <option id="opt_sun" value="Sun-Burst">SunBurst</option>
                <option id="opt_no" value="Sem Cor">Sem Cor</option>
            </select>

        </div>
        <div class="braco_content " [class.active]="section() == 'braco'">

            <div class="tipo_braco">
                <p> -- Tipo Braço -- </p>

                <div class="inputs">
                    <div class="sub_inputs">
                        <input type="radio" name="braco" value="inline" id="braco_inline" checked>
                        <label for="braco_inline">Inline</label>
                    </div>
                    <div class="sub_inputs">
                        <input type="radio" name="braco" value="3+3" id="braco_3_3">
                        <label for="braco_3_3">3+3</label>
                    </div>
                    <div class="sub_inputs">
                        <input type="radio" name="braco" value="4+2" id="braco_4_2">
                        <label for="braco_4_2">4+2</label>
                    </div>

                </div>

            </div>

            <div class="madeira_braco">
                <p> -- Madeira Braço -- </p>


                <div class="input_radio">
                    <label for="m_braco_maple">
                        <input type="radio" name="m_braco" value="Maple" id="m_braco_maple" checked>
                        <img src="maple.jpg" alt="Maple" width="50px" height="50px">
                    </label>Maple
                </div>

                <div class="input_radio">
                    <label for="m_braco_cedro">
                        <input type="radio" name="m_braco" value="Cedro" id="m_braco_cedro">
                        <img src="cedro.jpg" alt="Cedro" width="50px" height="50px">
                    </label>Cedro
                </div>

                <div class="input_radio">
                    <label for="m_braco_mogno">
                        <input type="radio" name="m_braco" value="Mógno" id="m_braco_mogno">
                        <img src="mogno.jpg" alt="Mógno" width="50px" height="50px">
                    </label>Mógno
                </div>


            </div>

            <div class="escala">
                <p> -- Madeira Escala -- </p>

                <div class="input_radio">
                    <label for="escala_rosewood" class="inputs">
                        <input type="radio" name="escala" value="Rosewood" id="escala_rosewood" checked>
                        <img src="rosewood.jpg" alt="Rosewood" width="50px" height="50px">
                    </label>Rose
                </div>

                <div class="input_radio">
                    <label for="escala_maple" class="inputs">
                        <input type="radio" name="escala" value="Maple" id="escala_maple">
                        <img src="maple.jpg" alt="Maple" width="50px" height="50px">
                    </label>Maple
                </div>

                <div class="input_radio">
                    <label for="escala_ebono" class="inputs">
                        <input type="radio" name="escala" value="Ebono" id="escala_ebono">
                        <img src="ebono.jpg" alt="Ebono" width="50px" height="50px">
                    </label>Ebono
                </div>



            </div>


            <p> -- Cor Braço -- </p>

            <select name="cor_bra" id="">
                <option id="opt_red" value="Vermelho">Vermelho</option>
                <option id="opt_blu" value="Azul">Azul</option>
                <option id="opt_blk" value="Preto">Preto</option>
                <option id="opt_yll" value="Amarelo">Amarelo</option>
                <option id="opt_no" value="Sem Cor">Sem Cor</option>
            </select>

        </div>
        <div class="hardware_content" [class.active]="section() == 'hardware'">

            <div class="estilo_hardware">
                <p> -- Estilo Hardware -- </p>

                <div class="inputs">
                    <div class="sub_inputs">
                        <input type="radio" name="estilo" value="3-Pickup" id="estilo_3_pickup" checked>
                        <label for="estilo_3_pickup" class="inputs">3-Pickup</label>
                    </div>

                    <div class="sub_inputs">
                        <input type="radio" name="estilo" value="2-Pickup" id="estilo_2_pickup">
                        <label for="estilo_2_pickup" class="inputs">2-Pickup</label>
                    </div>

                    <div class="sub_inputs">
                        <input type="radio" name="estilo" value="Jr" id="estilo_jr">
                        <label for="estilo_jr" class="inputs">Jr</label>
                    </div>

                </div>

            </div>

            <div class="captadores">
                <p> -- Captadores -- </p>

                <div class="inputs">
                    <div class="sub_inputs">
                        <input type="radio" name="captadores" value="Single Coil" id="captadores_single_coil" checked>
                        <label for="captadores_single_coil" class="inputs">Single Coil</label>
                    </div>

                    <div class="sub_inputs">
                        <input type="radio" name="captadores" value="Humbucker" id="captadores_humbucker">
                        <label for="captadores_humbucker" class="inputs">Humbucker</label>
                    </div>

                    <div class="sub_inputs">
                        <input type="radio" name="captadores" value="P90" id="captadores_p90">
                        <label for="captadores_p90" class="inputs">P90</label>
                    </div>

                </div>

            </div>

            <p> -- Cor Captadores -- </p>

            <select name="cor_cap" id="">
                <option id="opt_cro" value="Cromado">Cromado</option>
                <option id="opt_dou" value="Dourado">Dourado</option>
                <option id="opt_blk" value="Preto">Preto</option>
                <option id="opt_bra" value="Branco">Branco</option>
            </select>

            <p> -- Cor Hardware -- </p>

            <select name="cor_hard" id="">
                <option id="opt_cro" value="Cromado">Cromado</option>
                <option id="opt_dou" value="Dourado">Dourado</option>
                <option id="opt_blk" value="Preto">Preto</option>
                <option id="opt_bra" value="Branco">Branco</option>
            </select>
        </div>
    </div>
</div>
