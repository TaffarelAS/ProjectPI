<svg>
    <g [attr.transform]="transformForPosition()">
        @switch (captador.tipo) {
            @case ('single')   { <rect x="10" y="10" width="80" height="100" rx="10" [style.fill]="this.captador.cor" /> }
            @case ('humbucker')      { <rect x="5"  y="8"  width="90" height="104" rx="6"  [style.fill]="this.captador.cor" /> }
            @case ('p90')    { <rect x="10" y="6"  width="80" height="108" rx="6"  [style.fill]="this.captador.cor" /> }
        }
          <g fill="rgba(0,0,0,.55)">
            <circle cx="30" cy="30" r="3" /><circle cx="50" cy="30" r="3" /><circle cx="70" cy="30" r="3" />
            <circle cx="30" cy="90" r="3" /><circle cx="50" cy="90" r="3" /><circle cx="70" cy="90" r="3" />
        </g>
    </g>
</svg>
