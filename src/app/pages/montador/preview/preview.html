<div class="preview">
  <svg viewBox="0 0 400 700" class="preview__svg" [style.--hardware-cor]="montar().hardware.cor">
    <defs>
      <pattern id="wood-mogno" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#5b2d0e" />
        <path d="M0 10 Q20 5 40 12" stroke="#3b1c08" fill="none" />
        <path d="M0 25 Q20 20 40 27" stroke="#3b1c08" fill="none" />
      </pattern>
      <pattern id="wood-maple" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#e8c98a" />
        <path d="M0 8 Q20 3 40 10" stroke="#c9a86a" fill="none" />
      </pattern>
      <pattern id="wood-ash" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#d9c9a8" />
        <path d="M0 12 Q20 6 40 14" stroke="#b8a582" fill="none" />
      </pattern>
      <pattern id="wood-rosewood" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#4a2b1f" />
        <path d="M0 15 Q20 8 40 17" stroke="#2f1a12" fill="none" />
      </pattern>
      <pattern id="wood-ebony" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#1a1310" />
        <path d="M0 10 Q20 5 40 11" stroke="#2b1f1a" fill="none" />
      </pattern>
    </defs>

    <!-- Corpo -->
    <path class="preview__corpo"
          [attr.d]="formatos[montar().corpo.formato].path"
          [style.fill]="montar().corpo.acabamento.hex" />

    <!-- Braço -->
    <rect class="preview__braco"
          x="170" y="80" width="60" height="360" rx="6"
          [attr.fill]="'url(#wood-' + montar().braco.madeira + ')'" />

    <!-- Headstock -->
    <path class="preview__cabecote"
          [attr.d]="cabecotes[montar().cabecote.tipo]"
          [style.fill]="montar().cabecote.acabamento.hex" />

    <!-- Pickguard -->
    @if (montar().corpo.escudo) {
      <path class="preview__escudo"
            [attr.d]="escudos[montar().corpo.formato]"
            [style.fill]="montar().corpo.acabamento.hex" />
    }

    <!-- Captadores -->
    @for (p of montar().captadores; track p.posicao) {
      <app-captador [captador]="p" />
    }

    <!-- Ponte -->
    <app-ponte [type]="montar().ponte.tipo" 
                [material]="montar().ponte.material"
                [cor]="montar().ponte.cor" />
  </svg>
</div>
