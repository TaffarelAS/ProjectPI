<nav class="home">

  <div class="topo">
    <h1>Loja de Instrumentos Musicais</h1>

    <a routerLink="/carrinho" class="link-carrinho">
      Ver Carrinho
      ({{ carrinhoService.produtos.length }})
    </a>
  </div>

  <section class="secao" *ngFor="let categoria of categorias">

    <h2>{{ categoria.nome }}</h2>

    <hr>

    <div class="produtos">

      <div class="produto-card" *ngFor="let produto of categoria.produtos">

        <img
          [src]="produto.imagem"
          [alt]="produto.nome"
        >

        <h3>{{ produto.nome }}</h3>

        <p class="preco">
          {{ produto.preco | currency:'BRL' }}
        </p>

        <button (click)="adicionarAoCarrinho(produto)">
          Adicionar ao carrinho
        </button>

      </div>

    </div>

  </section>

</nav>
