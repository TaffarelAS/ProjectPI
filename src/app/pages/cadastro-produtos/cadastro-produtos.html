<form>
    <input type="text" placeholder="Nome" class="form-control" #nome>
    <input type="number" placeholder="Preço" class="form-control" #preco>
    <input type="number" placeholder="Quantidade" class="form-control" #quantidade>
    <input type="text" placeholder="Categoria" class="form-control" #categoria>

    <input type="button" value="Cadastrar" class="btn btn-primary" (click)="cadastrarProduto(nome.value, preco.value, quantidade.value, categoria.value)">
</form>
